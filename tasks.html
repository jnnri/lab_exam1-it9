<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Student Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-layout-text-sidebar-reverse me-2"></i>Student Task Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tasks.html">Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-outline-light btn-sm" id="theme-toggle">
                            <i class="bi bi-moon-stars-fill"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="mb-4">
            <h2><i class="bi bi-card-checklist me-2"></i>My Tasks</h2>
            <p class="text-muted">Add, manage, and keep track of your tasks.</p>
        </div>

        <form id="task-form" class="row g-2 mb-4">
            <div class="col-md-5">
                <input type="text" id="task-title" class="form-control" placeholder="Enter task title" required>
            </div>
            <div class="col-md-3">
                <input type="date" id="task-date" class="form-control" required>
            </div>
            <div class="col-md-2">
                <select id="task-priority" class="form-select">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="submit" id="form-submit-btn" class="btn btn-primary w-100">Add Task</button>
            </div>
        </form>

        <div class="row text-center mb-4 g-3">
            <div class="col-md-4">
                <div class="card p-3 border-0 shadow-sm">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="bi bi-list-task fs-1 text-primary me-3"></i>
                        <div class="text-start">
                            <small class="text-muted d-block">Total Tasks</small>
                            <span id="total-tasks" class="fs-3 fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 border-0 shadow-sm">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="bi bi-clock-history fs-1 text-warning me-3"></i>
                        <div class="text-start">
                            <small class="text-muted d-block">Pending</small>
                            <span id="pending-tasks" class="fs-3 fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 border-0 shadow-sm">
                    <div class="d-flex align-items-center justify-content-center">
                        <i class="bi bi-check-circle fs-1 text-success me-3"></i>
                        <div class="text-start">
                            <small class="text-muted d-block">Completed</small>
                            <span id="completed-tasks" class="fs-3 fw-bold">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between mb-3">
            <div class="input-group w-50">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" id="search-input" class="form-control" placeholder="Search tasks...">
            </div>
            <button id="clear-all-btn" class="btn btn-danger">
                <i class="bi bi-trash me-1"></i>Clear All
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle border">
                <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Task Title</th>
                        <th>Due Date</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="task-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
